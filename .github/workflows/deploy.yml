name: Deploy release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA of the release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  VPS_HOST: ${{ vars.VPS_HOST }}
  VPS_PORT: ${{ vars.VPS_PORT }}
  VPS_USER: ${{ vars.VPS_USER }}
  RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  deploy_release:
    name: Deploy images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Validate release SHA
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            'whoami && hostname && docker --version && docker compose version'

      - name: Check server readiness
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail

          echo "Checking application directory..."
          test -d /opt/mini-discord

          echo "Checking Compose file..."
          test -f /opt/mini-discord/docker-compose.yaml

          echo "Checking environment file..."
          test -f /opt/mini-discord/.env

          cd /opt/mini-discord

          echo "Validating Compose configuration..."
          docker compose config --quiet

          echo "Checking required commands..."
          command -v docker >/dev/null
          command -v curl >/dev/null

          echo "Checking PostgreSQL container..."
          postgres_container="$(docker compose ps -q --status running postgres)"

          if [[ -z "$postgres_container" ]]; then
            echo "PostgreSQL container is not running"
            exit 1
          fi

          echo "PostgreSQL container is running: $postgres_container"

          echo "Checking disk space..."
          df -h /

          echo "Server preflight completed successfully"
          REMOTE

      - name: Pull release images
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail

          release_sha="$1"

          backend_image="ghcr.io/qweratn/mini-discord-backend:$release_sha"
          frontend_image="ghcr.io/qweratn/mini-discord-frontend:$release_sha"

          echo "Pulling backend image..."
          docker pull "$backend_image"

          echo "Pulling frontend image..."
          docker pull "$frontend_image"

          echo "Verifying downloaded images..."
          docker image inspect "$backend_image" >/dev/null
          docker image inspect "$frontend_image" >/dev/null

          echo "Both release images are available locally"
          REMOTE

      - name: Activate release
        id: activate_release
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail

          release_sha="$1"
          backend_image="ghcr.io/qweratn/mini-discord-backend:$release_sha"
          frontend_image="ghcr.io/qweratn/mini-discord-frontend:$release_sha"

          cd /opt/mini-discord

          wait_for_health() {
            local label="$1"

            for attempt in {1..12}; do
              echo "$label health-check attempt $attempt of 12"

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                http://127.0.0.1/api/health > /dev/null; then
                echo "$label health-check passed"
                return 0
              fi

              sleep 5
            done

            echo "$label health-check failed"
            return 1
          }

          rollback_release() {
            echo "Restoring previous application images..."

            docker image inspect mini-discord-backend:previous >/dev/null || return 1
            docker image inspect mini-discord-frontend:previous >/dev/null || return 1

            docker tag \
              mini-discord-backend:previous \
              mini-discord-backend:local || return 1

            docker tag \
              mini-discord-frontend:previous \
              mini-discord-frontend:local || return 1

            docker compose up \
              -d \
              --no-build \
              --pull never \
              --force-recreate \
              --no-deps \
              backend frontend || return 1

            wait_for_health "Rollback"
          }

          echo "Verifying current and release images..."
          docker image inspect mini-discord-backend:local >/dev/null
          docker image inspect mini-discord-frontend:local >/dev/null
          docker image inspect "$backend_image" >/dev/null
          docker image inspect "$frontend_image" >/dev/null

          echo "Saving current images as previous..."
          docker tag \
            mini-discord-backend:local \
            mini-discord-backend:previous

          docker tag \
            mini-discord-frontend:local \
            mini-discord-frontend:previous

          echo "Tagging release images as local..."
          docker tag "$backend_image" mini-discord-backend:local
          docker tag "$frontend_image" mini-discord-frontend:local

          release_backend_id="$(docker image inspect "$backend_image" --format '{{.Id}}')"
          release_frontend_id="$(docker image inspect "$frontend_image" --format '{{.Id}}')"
          local_backend_id="$(docker image inspect mini-discord-backend:local --format '{{.Id}}')"
          local_frontend_id="$(docker image inspect mini-discord-frontend:local --format '{{.Id}}')"

          if [[ "$release_backend_id" != "$local_backend_id" ]]; then
            echo "Backend image tag verification failed"
            exit 1
          fi

          if [[ "$release_frontend_id" != "$local_frontend_id" ]]; then
            echo "Frontend image tag verification failed"
            exit 1
          fi

          echo "Recreating backend and frontend containers..."

          if ! docker compose up \
            -d \
            --no-build \
            --pull never \
            --force-recreate \
            --no-deps \
            backend frontend; then
            echo "Container deployment failed. Starting rollback..."

            if rollback_release; then
              echo "Rollback completed successfully"
            else
              echo "Rollback failed"
            fi

            exit 1
          fi

          docker compose ps postgres backend frontend

          if ! wait_for_health "Release"; then
            echo "Release health-check failed. Starting rollback..."

            if rollback_release; then
              echo "Rollback completed successfully"
            else
              echo "Rollback failed"
            fi

            exit 1
          fi

          printf '%s\n' "$release_sha" > .deployed-release.tmp
          mv .deployed-release.tmp .deployed-release

          echo "Deployment completed successfully: $release_sha"
          REMOTE

      - name: Show deployment summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.activate_release.outcome }}
        run: |
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Server: $VPS_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "Activation: $DEPLOY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
            echo "Result: deployment successful" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DEPLOY_OUTCOME" == "failure" ]]; then
            echo "Result: deployment failed; inspect the activation logs for rollback status" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Result: deployment did not reach the activation step" >> "$GITHUB_STEP_SUMMARY"
          fi
